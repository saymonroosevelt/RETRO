<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout — RETRO ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/qrcode.min.js"></script>
  <script src="../js/ranking.js"></script>
  <script src="../js/apoio.js"></script>
</head>
<body>

  <div class="game-header">
    <h1>BREAKOUT</h1>
    <a class="back-link" href="../index.html">◄ VOLTAR</a>
  </div>

  <div class="game-wrap">
    <div class="hud">
      <span>PONTOS: <b id="score">0</b></span>
      <span>VIDAS: <b id="lives">3</b></span>
      <span>NÍVEL: <b id="level">1</b></span>
    </div>

    <canvas id="c" width="720" height="520"></canvas>

    <div class="controls-info">
      <kbd>◀</kbd> <kbd>▶</kbd> ou <kbd>A</kbd> <kbd>D</kbd> — mover &nbsp;|&nbsp; <kbd>ESPAÇO</kbd> — lançar bola<br>
      No celular: arraste o dedo na tela
    </div>

    <!-- Anúncio abaixo do jogo -->
    <div class="ad-slot inline" style="width:100%">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="3333333333"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">BREAKOUT</h2>
    <p id="overlayText">Quebre todos os tijolos!<br>Não deixe a bola cair.</p>
    <button id="btnStart">▶ COMEÇAR</button>
    <div id="apoioGameover" class="apoio-gover hidden">
      <p class="apoio-gameover">Mais uma tentativa? 👾 Se você está curtindo o jogo, considere apoiar o criador.</p>
      <button class="btn-coin" id="btnCoinGameover">🪙 INSERT COIN</button>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const btnStart = document.getElementById('btnStart');

  const PADDLE_W = 100, PADDLE_H = 14, BALL_R = 7;
  const BRICK_ROWS = 5, BRICK_COLS = 10, BRICK_W = 64, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = 60;
  const ROW_COLORS = ['#ff2d95','#ff8a00','#ffd800','#39ff14','#00e5ff'];
  const ROW_POINTS = [50, 40, 30, 20, 10];

  let paddle, ball, bricks, score, lives, level, running, animId;
  let keys = {};

  function resetBall() {
    ball = { x: paddle.x + PADDLE_W/2, y: paddle.y - BALL_R - 2, dx: 0, dy: 0, stuck: true };
  }

  function buildLevel() {
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
          color: ROW_COLORS[r],
          points: ROW_POINTS[r],
          alive: true
        });
      }
    }
  }

  function init() {
    paddle = { x: W/2 - PADDLE_W/2, y: H - 40, speed: 8 };
    score = 0; lives = 3; level = 1;
    buildLevel();
    resetBall();
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  function launch() {
    if (ball.stuck) {
      ball.stuck = false;
      const angle = (Math.random() * 60 + 60) * Math.PI / 180; // 60°–120°
      const speed = 5 + level * 0.6;
      ball.dx = Math.cos(angle) * speed * (Math.random() < .5 ? -1 : 1);
      ball.dy = -Math.abs(Math.sin(angle) * speed);
    }
  }

  function update() {
    // Paddle
    if (keys.ArrowLeft || keys.a) paddle.x -= paddle.speed;
    if (keys.ArrowRight || keys.d) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - PADDLE_W, paddle.x));

    if (ball.stuck) { ball.x = paddle.x + PADDLE_W/2; ball.y = paddle.y - BALL_R - 2; return; }

    ball.x += ball.dx;
    ball.y += ball.dy;

    // Paredes
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.dx *= -1; }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.dx *= -1; }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.dy *= -1; }

    // Paddle
    if (ball.dy > 0 &&
        ball.y + BALL_R >= paddle.y && ball.y + BALL_R <= paddle.y + PADDLE_H + 8 &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + PADDLE_W + BALL_R) {
      const hit = (ball.x - (paddle.x + PADDLE_W/2)) / (PADDLE_W/2);
      const speed = Math.hypot(ball.dx, ball.dy);
      const angle = hit * 65 * Math.PI / 180; // até 65°
      ball.dx = Math.sin(angle) * speed;
      ball.dy = -Math.abs(Math.cos(angle) * speed);
      ball.y = paddle.y - BALL_R;
    }

    // Tijolos
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + BRICK_W &&
          ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + BRICK_H) {
        b.alive = false;
        score += b.points * level;
        // Colisão por eixo
        const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + BRICK_W - (ball.x - BALL_R));
        const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + BRICK_H - (ball.y - BALL_R));
        if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;
        updateHUD();
        break;
      }
    }

    // Todos quebrados?
    if (bricks.every(b => !b.alive)) {
      level++;
      buildLevel();
      resetBall();
      updateHUD();
      showOverlay('NÍVEL ' + level, 'Prepare-se!', '▶ CONTINUAR');
      running = false;
      return;
    }

    // Perdeu a bola
    if (ball.y - BALL_R > H) {
      lives--;
      updateHUD();
      if (lives <= 0) {
        gameOver();
      } else {
        resetBall();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Tijolos
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fillRect(b.x, b.y, BRICK_W, 4);
    }

    // Paddle
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(paddle.x, paddle.y, PADDLE_W, PADDLE_H);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(paddle.x, paddle.y, PADDLE_W, 4);

    // Bola
    ctx.fillStyle = '#ffd800';
    ctx.shadowColor = '#ffd800';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (ball.stuck) {
      ctx.fillStyle = '#39ff14';
      ctx.font = '12px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('ESPAÇO PARA LANÇAR', W/2, H - 70);
    }
  }

  function loop() {
    if (running) update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function showOverlay(title, text, btn) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text;
    btnStart.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() { overlay.classList.add('hidden'); }

  function gameOver() {
    running = false;
    showOverlay('FIM DE JOGO', 'PONTUAÇÃO: ' + score + '<br>RECORDE: ' + saveHigh(score), '▶ JOGAR DE NOVO');
    var ag = document.getElementById('apoioGameover'); if (ag) ag.classList.remove('hidden');
    if (window.RetroRanking) RetroRanking.prompt('BREAKOUT', score);
  }

  function saveHigh(s) {
    const hi = Math.max(s, parseInt(localStorage.getItem('breakout_hi') || '0'));
    localStorage.setItem('breakout_hi', hi);
    return hi;
  }

  btnStart.addEventListener('click', function(){
    if (lives <= 0 || !paddle) init();
    var ag = document.getElementById('apoioGameover'); if (ag) ag.classList.add('hidden');
    hideOverlay();
    running = true;
  });

  document.addEventListener('keydown', function(e){
    keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
    if (e.code === 'Space') { launch(); e.preventDefault(); }
  });
  document.addEventListener('keyup', function(e){
    keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
  });

  // Controle por toque
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W/2));
  }, {passive:false});
  canvas.addEventListener('touchstart', launch);

  init();
  loop();
})();
</script>
</body>
</html>
