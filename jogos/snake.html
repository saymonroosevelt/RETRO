<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — RETRO ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/qrcode.min.js"></script>
  <script src="../js/ranking.js"></script>
  <script src="../js/apoio.js"></script>
</head>
<body>

  <div class="game-header">
    <h1>SNAKE</h1>
    <a class="back-link" href="../index.html">◄ VOLTAR</a>
  </div>

  <div class="game-wrap">
    <div class="hud">
      <span>PONTOS: <b id="score">0</b></span>
      <span>RECORDE: <b id="hi">0</b></span>
    </div>

    <canvas id="c" width="560" height="560"></canvas>

    <div class="controls-info">
      <kbd>◄</kbd><kbd>▲</kbd><kbd>▼</kbd><kbd>►</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — mover<br>
      No celular: deslize o dedo na tela
    </div>

    <div class="ad-slot inline" style="width:100%">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="6666666666"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2>SNAKE</h2>
    <p>Coma as frutas e cresça!<br>Não bata nas paredes nem em si mesma.</p>
    <button id="btnStart">▶ COMEÇAR</button>
  </div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GRID = 20, COLS = W / GRID, ROWS = H / GRID;

  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hi');
  const overlay = document.getElementById('overlay');
  const btnStart = document.getElementById('btnStart');

  let snake, dir, nextDir, food, score, hi, speed, tick, running, loopId;

  hi = parseInt(localStorage.getItem('snake_hi') || '0');
  hiEl.textContent = hi;

  function placeFood() {
    let p;
    do {
      p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }

  function init() {
    snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 8; // ticks por segundo
    tick = 0;
    placeFood();
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    hiEl.textContent = hi;
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Paredes
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();

    // Próprio corpo
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      speed = Math.min(speed + 0.4, 20);
      placeFood();
      if (score > hi) { hi = score; localStorage.setItem('snake_hi', hi); }
      updateHUD();
    } else {
      snake.pop();
    }
  }

  function die() {
    running = false;
    overlay.querySelector('h2').textContent = 'FIM DE JOGO';
    overlay.querySelector('p').innerHTML = 'PONTOS: ' + score + '<br>RECORDE: ' + hi;
    btnStart.textContent = '▶ JOGAR DE NOVO';
    overlay.classList.remove('hidden');
    if (window.RetroRanking) RetroRanking.prompt('SNAKE', score);
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Grade sutil
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*GRID); ctx.lineTo(W, i*GRID); ctx.stroke();
    }

    // Fruta (maçã pixelada)
    ctx.fillStyle = '#ff2d95';
    ctx.shadowColor = '#ff2d95';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(food.x*GRID + GRID/2, food.y*GRID + GRID/2, GRID/2 - 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Cobra
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#ffd800' : `rgb(${Math.floor(57 - t*40)}, ${Math.floor(255 - t*120)}, ${Math.floor(20 + t*30)})`;
      ctx.fillRect(s.x*GRID + 1, s.y*GRID + 1, GRID - 2, GRID - 2);
    });

    // Olhos da cobra
    const h = snake[0];
    ctx.fillStyle = '#000';
    const cx = h.x*GRID + GRID/2, cy = h.y*GRID + GRID/2;
    ctx.fillRect(cx + dir.x*5 - dir.y*3 - 2, cy + dir.y*5 - dir.x*3 - 2, 4, 4);
    ctx.fillRect(cx + dir.x*5 + dir.y*3 - 2, cy + dir.y*5 + dir.x*3 - 2, 4, 4);
  }

  function loop(ts) {
    if (running) {
      if (!loop.last) loop.last = ts;
      if (ts - loop.last > 1000 / speed) {
        step();
        loop.last = ts;
      }
    } else {
      loop.last = ts;
    }
    draw();
    requestAnimationFrame(loop);
  }

  btnStart.addEventListener('click', function(){
    init();
    overlay.classList.add('hidden');
    running = true;
  });

  function setDir(x, y) {
    if (x === -dir.x && y === -dir.y) return; // não pode voltar
    nextDir = {x, y};
  }

  document.addEventListener('keydown', function(e){
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else return;
    e.preventDefault();
  });

  // Swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', function(e){
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', function(e){
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
    touchStart = null;
  });

  init();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
